url: https://github.com/acttk/dsh-bili-interactor
name: acttk/dsh-bili-interactor
category: tools
description:
  en: 'Browses Bilibili on your behalf and actually takes part: search videos, like, coin, send danmaku, post comments, reply to other people, and keep replying when someone answers back. Reads the video''s Bilibili AI subtitle so its comments talk about what the video really says rather than just the title, and can transcribe the audio locally when there is no subtitle. Remembers which videos it already browsed so it stops showing you the same ones, learns from comment sections into a memory you set the criteria for, de-duplicates replies per thread, and checks whether a comment is genuinely public or only visible to your own account. Six-tab settings panel with an environment self-check that tells you exactly what to install.'
  zh: '替你在 B 站上真的动手：搜视频、点赞、投币、发弹幕、发评论、回别人的评论，别人回了还能接着聊。会读视频的 B 站 AI 字幕，所以评论说的是视频里真正讲了什么，而不只是吐槽标题；没有字幕时可以本地转写语音。记得刷过哪些视频，不再反复推同一条；从评论区学习，记什么由你定标准；同一楼不重复回复；还能查一条评论是真公开了还是只有你自己看得见。六页签设置面板，自带环境自检，缺什么直接告诉你。'
icon: https://raw.githubusercontent.com/acttk/dsh-bili-interactor/main/assets/icon-180.png
